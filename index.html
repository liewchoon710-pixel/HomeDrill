<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Military-style home workouts: bodyweight conditioning and resistance band muscle building, with guided timers and progress tracking.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HomeDrill: military home workout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E2DFD0; --surface:#EFEDE3; --line:#C3BFAA; --text:#232A1C; --muted:#5E654F;
  --olive:#4B5A34; --accent:#B56A00; --accentText:#FFFFFF; --danger:#A33A2A;
  --workBg:#46552F; --workText:#F2EED9; --restBg:#E2DFD0; --restText:#232A1C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B2016; --surface:#252C1E; --line:#39422F; --text:#E6E1CB; --muted:#A1A48A;
    --olive:#8FA162; --accent:#E8A317; --accentText:#1B2016; --danger:#E0664F;
    --workBg:#3F4D2A; --workText:#F2EED9; --restBg:#1B2016; --restText:#E6E1CB;
  }
}
:root[data-theme="dark"]{
  --bg:#1B2016; --surface:#252C1E; --line:#39422F; --text:#E6E1CB; --muted:#A1A48A;
  --olive:#8FA162; --accent:#E8A317; --accentText:#1B2016; --danger:#E0664F;
  --workBg:#3F4D2A; --workText:#F2EED9; --restBg:#1B2016; --restText:#E6E1CB;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Barlow,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
.stencil{font-family:"Big Shoulders Stencil Display",Impact,"Arial Narrow",sans-serif;font-weight:900;letter-spacing:.01em}
.wrap{max-width:560px;margin:0 auto;padding:18px 18px 110px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:3px solid var(--text);padding-bottom:8px;margin-bottom:20px}
header.top h1{margin:0;font-size:52px;line-height:.85}
header.top .rank{font-weight:600;color:var(--muted);font-size:15px;text-align:right}
h2{font-family:"Big Shoulders Stencil Display",Impact,sans-serif;font-weight:900;font-size:34px;line-height:1;margin:4px 0 6px}
h3{font-size:18px;margin:26px 0 10px;font-weight:700}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:transparent;color:var(--text);font:600 16px Barlow,sans-serif;padding:9px 14px;border-radius:4px;cursor:pointer;min-width:52px}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle input{width:22px;height:22px;accent-color:var(--olive)}
.btn{appearance:none;border:0;background:var(--accent);color:var(--accentText);font:700 19px Barlow,sans-serif;padding:16px 20px;border-radius:5px;width:100%;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn:focus-visible,.chip:focus-visible,nav button:focus-visible,.cell:focus-visible,.icon:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
ol.drill{list-style:none;margin:0;padding:0;counter-reset:d}
ol.drill li{counter-increment:d;display:grid;grid-template-columns:34px 1fr;align-items:start;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
ol.drill li:last-child{border-bottom:0}
ol.drill li::before{content:counter(d);font-family:"Big Shoulders Stencil Display",Impact,sans-serif;font-weight:900;font-size:28px;line-height:1;color:var(--olive)}
ol.drill b{display:block}
ol.drill .fig{grid-column:2;width:min(100%,250px);margin:6px 0 2px;background:var(--bg);border-radius:6px;cursor:zoom-in}
ol.drill span{grid-column:2;color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px}
.stat .v{font-family:"Big Shoulders Stencil Display",Impact,sans-serif;font-weight:900;font-size:40px;line-height:1}
.stat .l{font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:62px repeat(4,1fr);gap:6px;align-items:center}
.grid .wk{font-weight:700;font-size:15px}
.cell{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font:600 15px Barlow,sans-serif;height:42px;border-radius:4px;cursor:pointer}
.cell.done{background:var(--olive);border-color:var(--olive);color:var(--bg)}
.cell.now{border:2.5px solid var(--accent);color:var(--text)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.icon{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:4px;padding:6px 9px;font:600 13px Barlow,sans-serif;cursor:pointer;white-space:nowrap}
.icon.armed{color:var(--danger);border-color:var(--danger)}
.test{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.test:last-child{border-bottom:0}
.test .btn{width:auto;padding:11px 16px;font-size:16px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--text);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{appearance:none;border:0;background:transparent;color:var(--muted);font:600 15px Barlow,sans-serif;padding:14px 4px;cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--text);box-shadow:inset 0 3px 0 var(--accent)}
/* player */
#player{position:fixed;left:0;right:0;top:0;bottom:0;z-index:20;display:none;background:var(--restBg);color:var(--restText);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#player.open{display:block}
#player.work{background:var(--workBg);color:var(--workText)}
#player .pin{max-width:560px;height:100%;margin:0 auto;padding:16px 20px;display:flex;flex-direction:column}
.pbar{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px;opacity:.85}
.prog{height:5px;background:rgba(127,127,127,.3);border-radius:3px;margin:10px 0 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.pmain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;min-height:0}
.ring{position:relative;width:min(44vw,190px);aspect-ratio:1}
.fig{display:block;height:auto;color:inherit}
.pfig{width:min(84vw,340px);margin-bottom:-4px}
#figview,#acct{position:fixed;left:0;right:0;top:0;bottom:0;z-index:30;background:var(--bg);color:var(--text);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;overflow-y:auto}
#figview[hidden],#acct[hidden]{display:none}
.fvin{max-width:620px;width:100%;margin:auto;padding:20px;display:flex;flex-direction:column;gap:14px;text-align:center}
.fbig{width:100%;background:var(--surface);border-radius:8px}
@media (max-height:700px){.pfig{width:min(66vw,260px)}.ring{width:min(36vw,150px)}}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Big Shoulders Stencil Display",Impact,sans-serif;font-weight:900;font-size:min(20vw,86px);line-height:1}
.pname{font-family:"Big Shoulders Stencil Display",Impact,sans-serif;font-weight:900;font-size:clamp(34px,10vw,52px);line-height:1;margin-top:12px}
.pcue{font-size:17px;opacity:.85;max-width:34ch}
.pnext{font-size:15px;opacity:.75;margin-top:6px}
.pctl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;margin-top:10px}
.pctl button{appearance:none;border:1.5px solid currentColor;background:transparent;color:inherit;font:700 17px Barlow,sans-serif;padding:15px 8px;border-radius:5px;cursor:pointer}
.pctl button.main{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
.pend{appearance:none;border:0;background:transparent;color:inherit;font:600 15px Barlow,sans-serif;padding:12px;margin-top:6px;cursor:pointer;opacity:.8;text-decoration:underline}
.finish{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.finish input{font:700 44px "Big Shoulders Stencil Display",Impact,sans-serif;width:100%;padding:8px 12px;border:2px solid var(--line);border-radius:5px;background:var(--surface);color:var(--text);text-align:center}
#player .chip{color:inherit;border-color:currentColor}
#player .chip[aria-pressed="true"]{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
#player .chips .chip{padding:8px 11px;min-width:0;font-size:15px}
.step{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:8px}
.step button{appearance:none;width:58px;height:58px;border-radius:50%;border:2px solid currentColor;background:transparent;color:inherit;font:700 30px Barlow,sans-serif;cursor:pointer}
.step .rv{font-family:"Big Shoulders Stencil Display",Impact,sans-serif;font-weight:900;font-size:84px;line-height:1;min-width:2ch;text-align:center}
.step button:focus-visible,.pctl button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="stencil">HOME<br>DRILL</h1>
    <div style="text-align:right"><div class="rank" id="rankLine"></div><button class="icon" id="acctBtn" hidden style="margin-top:8px;font-size:14px;padding:7px 10px;color:var(--text)">Sign in</button></div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="train">Train</button>
  <button data-tab="program">Program</button>
  <button data-tab="test">Fitness test</button>
  <button data-tab="log">Log</button>
</div></nav>

<div id="acct" hidden role="dialog" aria-modal="true" aria-label="Account"></div>
<div id="figview" hidden role="dialog" aria-modal="true" aria-label="Exercise demo"></div>
<div id="player" role="dialog" aria-modal="true" aria-label="Workout"><div class="pin" id="pin"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
/* ---------- data ---------- */
const EX={
 pushup:{n:'Push-ups',c:'Body straight, chest to fist height.',cat:'upper'},
 wide:{n:'Wide push-ups',c:'Hands wider than shoulders.',cat:'upper'},
 diamond:{n:'Diamond push-ups',c:'Hands together under your chest.',cat:'upper'},
 pike:{n:'Pike push-ups',c:'Hips high, lower your head toward the floor.',cat:'upper'},
 hrpush:{n:'Hand-release push-ups',c:'Chest to floor, lift hands, press back up.',cat:'upper'},
 divebomb:{n:'Dive bombers',c:'Swoop chest forward, then push hips back.',cat:'upper'},
 shtaps:{n:'Plank shoulder taps',c:'Hips square, tap the opposite shoulder.',cat:'upper'},
 dips:{n:'Chair dips',c:'Sturdy chair against a wall, elbows point back.',cat:'upper'},
 squat:{n:'Squats',c:'Hips below knees, chest up.',cat:'lower'},
 lunge:{n:'Reverse lunges',c:'Step back, back knee near the floor.',cat:'lower'},
 splitsq:{n:'Split squats',c:'Stay in lunge stance, switch legs halfway.',cat:'lower'},
 wallsit:{n:'Wall sit',c:'Thighs parallel, back flat on the wall.',cat:'lower'},
 bridge:{n:'Glute bridges',c:'Squeeze at the top for one second.',cat:'lower'},
 calf:{n:'Calf raises',c:'Slow up, slow down.',cat:'lower'},
 pulsesq:{n:'Pulse squats',c:'Stay low, small fast pulses.',cat:'lower'},
 jsquat:{n:'Jump squats',c:'Land soft and sink straight into the next rep.',cat:'lower',loud:1},
 situp:{n:'Sit-ups',c:'All the way up, controlled on the way down.',cat:'core'},
 flutter:{n:'Flutter kicks',c:'Lower back pressed into the floor.',cat:'core'},
 legraise:{n:'Leg raises',c:'Legs straight, stop just above the floor.',cat:'core'},
 plank:{n:'Plank',c:'Forearms down, straight line head to heel.',cat:'core'},
 sideplank:{n:'Side plank',c:'Switch sides halfway.',cat:'core'},
 superman:{n:'Superman hold',c:'Lift arms and legs off the floor and hold.',cat:'core'},
 bicycle:{n:'Bicycle crunches',c:'Elbow to opposite knee.',cat:'core'},
 vups:{n:'V-ups',c:'Hands meet feet at the top.',cat:'core'},
 sqthrust:{n:'Squat thrusts',c:'Hands down, feet back, feet in, stand. No jump.',cat:'cardio'},
 eightc:{n:'8-count bodybuilders',c:'Squat, kick back, push-up, legs out, in, stand.',cat:'cardio'},
 mclimb:{n:'Mountain climbers',c:'Drive knees fast, hips low.',cat:'cardio'},
 stepjack:{n:'Step jacks',c:'Step side to side, arms overhead.',cat:'cardio'},
 march:{n:'Fast march',c:'Knees high, pump the arms.',cat:'cardio'},
 bearcrawl:{n:'Bear crawl in place',c:'Knees hover. Two steps forward, two back.',cat:'cardio'},
 burpee:{n:'Burpees',c:'Chest to floor, jump at the top.',cat:'cardio',loud:1},
 jj:{n:'Jumping jacks',c:'Arms fully overhead.',cat:'cardio',loud:1},
 hknees:{n:'High knees',c:'Knees to hip height, stay on your toes.',cat:'cardio',loud:1},
 skaters:{n:'Skaters',c:'Leap side to side, land soft.',cat:'cardio',loud:1}
};
const LEVELS=[
 {name:'Recruit',desc:'New to training, or coming back after a break.',w0:30,w1:45,r0:30,r1:20},
 {name:'Trooper',desc:'You can do about 20 push-ups in a row.',w0:40,w1:55,r0:20,r1:15},
 {name:'Commando',desc:'You can do 40+ push-ups and 60+ sit-ups in 2 minutes.',w0:45,w1:60,r0:15,r1:10}
];
const DAYS=[
 {t:'Upper body and core',s:['upper','upper','core','cardio','upper','core']},
 {t:'Legs and conditioning',s:['lower','cardio','lower','core','lower','cardio']},
 {t:'Full body',s:['upper','lower','cardio','core','upper','lower']},
 {t:'Core and endurance',s:['core','cardio','core','upper','core','lower']}
];
const WEEKS=8, DPW=4, MINS=[10,15,20,30,45];
const TESTS=[
 {id:'push',name:'Push-ups',secs:120,unit:'reps',how:'Max push-ups in 2 minutes. Rest only in the up position.'},
 {id:'sit',name:'Sit-ups',secs:120,unit:'reps',how:'Max sit-ups in 2 minutes. Feet anchored under a bed or sofa.'},
 {id:'plank',name:'Plank hold',secs:0,unit:'sec',how:'Hold a forearm plank as long as you can with good form.'}
];

/* ---------- state ---------- */
const KEY='roomdrill_v1';
const DEF={track:'mil',mlevel:0,mw:1,md:1,mfin:false,mmins:30,lifts:{},level:0,week:1,day:1,finished:false,done:{},sessions:[],tests:[],quiet:true,voice:true,mins:20};
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(r));}catch(e){}return JSON.parse(JSON.stringify(DEF));}
function save(){S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}try{cloudQueue();}catch(e){}}
let S=load(), tab='train', armed=null;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+pad(s%60)};
function rng(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}

/* ---------- session builder ---------- */
function buildSession(level,week,day,mins,quiet){
 const L=LEVELS[level], f=(week-1)/(WEEKS-1);
 const work=Math.round(L.w0+(L.w1-L.w0)*f), rest=Math.round(L.r0+(L.r1-L.r0)*f);
 const tpl=DAYS[day-1], n=mins<=15?5:6, slots=tpl.s.slice(0,n);
 const r=rng(level+'-'+week+'-'+day+'-'+(quiet?1:0)), used=new Set(), list=[];
 slots.forEach(cat=>{
  const pool=Object.keys(EX).filter(k=>EX[k].cat===cat&&!used.has(k)&&!(quiet&&EX[k].loud));
  const k=pool[Math.floor(r()*pool.length)]; used.add(k); list.push(k);
 });
 const warm=[['Arm circles','Small to big, both directions.'],quiet?['March in place','Easy pace, loosen up.']:['Jumping jacks','Easy pace, loosen up.'],['Slow squats','Full depth, no rush.'],['Inchworms','Walk hands out to plank and back.'],['Hip openers','Big circles with each knee.'],['Torso twists','Rotate gently side to side.']].slice(0,mins<=15?4:6);
 const cool=[['Child\'s pose','Sit back, arms long, breathe slow.'],['Hamstring stretch','Legs straight, reach toward your toes.'],['Quad stretch','Hold each side 15 seconds.'],['Chest opener','Clasp hands behind your back and lift.']].slice(0,mins<=15?3:4);
 const warmS=warm.length*30, coolS=cool.length*30, main=mins*60-warmS-coolS, rb=60;
 const roundLen=n*work+(n-1)*rest;
 const rounds=Math.max(1,Math.round((main+rb)/(roundLen+rb)));
 const ph=[];
 warm.forEach(w=>ph.push({name:w[0],cue:w[1],secs:30,type:'warm',label:'Warm-up',fig:FIGMAP[w[0]]}));
 for(let k=1;k<=rounds;k++){
  list.forEach((id,i)=>{
   ph.push({name:EX[id].n,cue:EX[id].c,secs:work,type:'work',label:'Round '+k+' of '+rounds,fig:FIGMAP[id]});
   if(i<n-1)ph.push({name:'Rest',cue:'Shake it out. Breathe.',secs:rest,type:'rest',label:'Round '+k+' of '+rounds});
  });
  if(k<rounds)ph.push({name:'Round break',cue:'Drink some water.',secs:rb,type:'rest',label:'After round '+k});
 }
 cool.forEach(c=>ph.push({name:c[0],cue:c[1],secs:30,type:'cool',label:'Cool-down',fig:FIGMAP[c[0]]}));
 const total=ph.reduce((a,p)=>a+p.secs,0);
 return {title:tpl.t,level,week,day,mins,work,rest,rounds,list,phases:ph,total};
}

/* ---------- render ---------- */
function render(){
 document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
 $('#rankLine').innerHTML=rankTxt();
 $('#view').innerHTML=({train:vTrain,program:vProgram,test:vTest,log:vLog})[tab]();
 bind();bindBackup();
}
function vTrainMil(){
 if(S.finished)return `<div class="panel"><h2>Program complete</h2><p>You finished all ${WEEKS} weeks at ${LEVELS[S.level].name} level. Take a fitness test to see how far you've come, then move up a level or run it again.</p></div>
 <h3>Next step</h3><div class="chips">${S.level<2?`<button class="chip" data-act="levelup">Start ${LEVELS[S.level+1].name} program</button>`:''}<button class="chip" data-act="restart">Run it again</button></div>`;
 const s=buildSession(S.level,S.week,S.day,S.mins,S.quiet);
 return `<p class="muted small" style="margin:0">Week ${S.week}, day ${S.day} of ${DPW}</p>
 <h2>${s.title}</h2>
 <p class="muted">${s.work}s work, ${s.rest}s rest, ${s.rounds} round${s.rounds>1?'s':''}. About ${Math.round(s.total/60)} minutes.</p>
 <h3>How long do you have?</h3>
 <div class="chips">${MINS.map(m=>`<button class="chip" data-mins="${m}" aria-pressed="${S.mins===m}">${m} min</button>`).join('')}</div>
 <h3>The drill</h3>
 <div class="panel"><ol class="drill">${s.list.map(id=>`<li><b>${EX[id].n}</b>${figSVG(FIGMAP[id])}<span>${EX[id].c}</span></li>`).join('')}</ol>
 <p class="muted small" style="margin:10px 0 0">Tap a picture to see it full screen. Warm-up and cool-down stretches are added automatically.</p></div>
 <h3>Settings</h3>
 <div class="panel" style="padding:4px 16px">
  <label class="toggle"><span>Quiet mode<br><span class="muted small">No jumping. Good for upstairs neighbours.</span></span><input type="checkbox" id="quiet" ${S.quiet?'checked':''}></label>
  <label class="toggle"><span>Voice callouts<br><span class="muted small">Reads out each exercise.</span></span><input type="checkbox" id="voice" ${S.voice?'checked':''}></label>
 </div>
 <div style="margin-top:22px"><button class="btn" data-act="start">Start workout</button></div>`;
}
function vProgramMil(){
 let g='<div class="grid"><span></span>'+[1,2,3,4].map(d=>`<span class="muted small" style="text-align:center">Day ${d}</span>`).join('');
 for(let w=1;w<=WEEKS;w++){
  g+=`<span class="wk">Week ${w}</span>`;
  for(let d=1;d<=DPW;d++){
   const done=S.done[S.level+'-'+w+'-'+d], now=!S.finished&&S.week===w&&S.day===d;
   g+=`<button class="cell ${done?'done':''} ${now?'now':''}" data-go="${w}-${d}" aria-label="Week ${w} day ${d}${done?', done':''}${now?', next up':''}">${done?'✓':now?'Next':DAYS[d-1].t.split(' ')[0]}</button>`;
  }
 }
 g+='</div>';
 const armedR=armed==='restart';
 return `<h2>${WEEKS}-week program</h2>

function spark(vals){
 if(vals.length<2)return '';
 const w=260,h=50,mx=Math.max(...vals),mn=Math.min(...vals),rg=(mx-mn)||1;
 const pts=vals.map((v,i)=>((i/(vals.length-1))*(w-8)+4).toFixed(1)+','+(h-4-((v-mn)/rg)*(h-12)).toFixed(1)).join(' ');
 return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Trend of last ${vals.length} results" style="grid-column:1/-1;max-width:320px"><polyline points="${pts}" fill="none" stroke="var(--olive)" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
}
function vTest(){
 return `<h2>Fitness test</h2>
 <p class="muted">Test yourself every 2 to 4 weeks to track progress. Done fresh, not after a workout.</p>
 <div class="panel" style="padding:2px 16px">${TESTS.map(t=>{
  const res=S.tests.filter(x=>x.type===t.id), vals=res.map(x=>x.value);
  const best=vals.length?Math.max(...vals):null, last=vals.length?vals[vals.length-1]:null;
  const show=v=>t.unit==='sec'?fmt(v):v;
  return `<div class="test"><div>${figSVG(({push:'pushup',sit:'situp',plank:'plank'})[t.id],'fig').replace('<svg ','<svg style="width:120px;display:block;margin-bottom:4px" ')}<b>${t.name}</b><br><span class="muted small">${t.how}</span><br>
  <span class="small">${best===null?'No result yet':`Best <b>${show(best)}</b>, last <b>${show(last)}</b>`}</span></div>
  <button class="btn" data-test="${t.id}">Start</button>${spark(vals.slice(-10))}</div>`;}).join('')}</div>`;
}
function vLog(){
 const days=new Set(S.sessions.map(s=>dkey(new Date(s.ts))));
 let streak=0,d=new Date();if(!days.has(dkey(d)))d.setDate(d.getDate()-1);
 while(days.has(dkey(d))){streak++;d.setDate(d.getDate()-1);}
 const mins=S.sessions.reduce((a,s)=>a+s.mins,0);
 // weekly bars (Mon start)
 const now=new Date(),mon=new Date(now);mon.setHours(0,0,0,0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
 const weeks=[];for(let i=7;i>=0;i--){const s=new Date(mon);s.setDate(s.getDate()-7*i);const e=new Date(s);e.setDate(e.getDate()+7);
  weeks.push({s,m:S.sessions.filter(x=>x.ts>=s.getTime()&&x.ts<e.getTime()).reduce((a,x)=>a+x.mins,0)});}
 const mx=Math.max(60,...weeks.map(w=>w.m)),W=320,H=150,bw=W/8;
 const bars=weeks.map((w,i)=>{const bh=(w.m/mx)*(H-40);return `<rect x="${i*bw+6}" y="${H-22-bh}" width="${bw-12}" height="${Math.max(bh,1)}" fill="${i===7?'var(--accent)':'var(--olive)'}" rx="2"/>
  ${w.m?`<text x="${i*bw+bw/2}" y="${H-27-bh}" text-anchor="middle" font-size="11" fill="var(--text)" font-family="Barlow,sans-serif">${w.m}</text>`:''}
  <text x="${i*bw+bw/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Barlow,sans-serif">${w.s.getDate()}/${w.s.getMonth()+1}</text>`}).join('');
 const list=S.sessions.slice().reverse().slice(0,40);
 return `<h2>Training log</h2>
 <div class="stats"><div class="stat"><div class="v">${streak}</div><div class="l">Day streak</div></div>
 <div class="stat"><div class="v">${S.sessions.length}</div><div class="l">Sessions</div></div>
 <div class="stat"><div class="v">${mins}</div><div class="l">Minutes</div></div></div>
 <h3>Minutes per week</h3>
 <div class="panel chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutes trained in each of the last 8 weeks">${bars}</svg></div>
 ${liftsHTML()}
 <h3>History</h3>
 ${list.length?`<ul class="hist">${list.map(s=>{const dt=new Date(s.ts);return `<li><div><b>${s.title}</b><br><span class="muted small">${dt.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}, ${s.mins} min${s.effort?', effort '+s.effort+'/5':''}${s.full?'':' (ended early)'}</span></div>
 <button class="icon ${armed==='del'+s.ts?'armed':''}" data-del="${s.ts}">${armed==='del'+s.ts?'Tap to delete':'Delete'}</button></li>`}).join('')}</ul>`
 :`<div class="panel"><p style="margin:0">No sessions yet. Finish your first workout on the Train tab and it will show up here.</p></div>`}
 ${vBackup()}`;
}

let ac=null,wake=null;
function initAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}}
function beep(f,ms){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+ms/1000);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+ms/1000);}catch(e){}}
function say(t){if(!S.voice||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=1.05;speechSynthesis.speak(u);}catch(e){}}
async function lockScreen(){try{if('wakeLock' in navigator)wake=await navigator.wakeLock.request('screen');}catch(e){}}
function unlockScreen(){try{wake&&wake.release();}catch(e){}wake=null;}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}

/* ---------- player ---------- */
let run=null,timer=null;
function openPlayer(){$('#player').classList.add('open');document.body.style.overflow='hidden';lockScreen();}
function closePlayer(){clearInterval(timer);timer=null;run=null;$('#player').className='';document.body.style.overflow='';unlockScreen();try{speechSynthesis.cancel()}catch(e){}render();}

function startWorkout(){
 initAudio();
 const s=buildSession(S.level,S.week,S.day,S.mins,S.quiet);
 run={mode:'workout',sess:s,phases:[{name:'Get ready',cue:'First up: '+s.phases[0].name,secs:10,type:'ready',label:s.title}].concat(s.phases),i:0,paused:false,doneSecs:0,endArm:false};
 openPlayer();begin(0);timer=setInterval(tick,200);
}
function begin(i){
 run.i=i;const p=run.phases[i];run.dur=p.secs;run.end=Date.now()+p.secs*1000;run.lastBeep=null;run.paused=false;
 if(i>0){beep(p.type==='work'?1040:660,p.type==='work'?450:250);buzz(p.type==='work'?[120,60,120]:80);}
 const nx=nextWork(i);
 if(p.type==='work')say(p.name);
 else if(p.type==='rest')say(nx?'Rest. Next, '+nx.name:'Rest');
 else if(p.type==='warm'||p.type==='cool')say(p.name);
 else if(p.type==='ready')say('Get ready. '+p.cue);
 drawPlayer();
}
function nextWork(i){for(let k=i+1;k<run.phases.length;k++)if(run.phases[k].type!=='rest')return run.phases[k];return null;}
function remaining(){return run.paused?run.pausedLeft:Math.max(0,run.end-Date.now());}
function tick(){
 if(run&&run.mode==='lift'){liftTick();return;}
 if(!run||run.mode==='finish'||run.paused)return;
 if(run.mode==='stopwatch'){const n=$('#swnum');if(n)n.textContent=fmt(Math.floor((Date.now()-run.t0)/1000));return;}
 const ms=remaining(),left=Math.ceil(ms/1000);
 if(left<=3&&left>0&&run.lastBeep!==left){run.lastBeep=left;beep(820,120);}
 if(ms<=0){
  if(run.phases[run.i].type!=='ready')run.doneSecs+=run.phases[run.i].secs;
  if(run.i+1<run.phases.length)begin(run.i+1);else complete(true);
  return;
 }
 updateClock();
}
function updateClock(){
 const ms=remaining(),left=Math.ceil(ms/1000),frac=run.dur?ms/(run.dur*1000):0;
 const n=$('#pnum'),c=$('#parc');if(!n)return;
 n.textContent=run.dur>=60&&left>=60?fmt(left):left;
 c.setAttribute('stroke-dashoffset',(565.5*(1-frac)).toFixed(1));
 const tot=run.phases.reduce((a,p)=>a+p.secs,0),past=run.phases.slice(0,run.i).reduce((a,p)=>a+p.secs,0)+(run.dur-ms/1000);
 const pr=$('#pprog');if(pr)pr.style.width=Math.min(100,past/tot*100)+'%';
}
function drawPlayer(){
 const pl=$('#player'),pin=$('#pin');
 if(run.mode==='stopwatch'){
  pl.className='open work';
  const secs=run.paused?run.sw:Math.floor((Date.now()-run.t0)/1000);
  pin.innerHTML=`<div class="pbar"><span>${run.test.name}</span><span>Hold it</span></div>
  <div class="pmain"><div class="ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" fill="none" stroke="currentColor" stroke-opacity=".2" stroke-width="10"/></svg><div class="num" id="swnum">${fmt(secs)}</div></div>
  ${figSVG('plank','fig pfig')}<div class="pname">Plank</div><div class="pcue">Straight line head to heel. Stop when your hips sag.</div></div>
  <div class="pctl" style="grid-template-columns:1fr"><button class="main" id="swstop">Stop and save</button></div>
  <button class="pend" id="pquit">Cancel test</button>`;
  $('#swstop').onclick=()=>{const v=Math.floor((Date.now()-run.t0)/1000);beep(660,300);S.tests.push({ts:Date.now(),type:'plank',value:v});save();closePlayer();};
  $('#pquit').onclick=closePlayer;return;
 }
 const p=run.phases[run.i],nx=nextWork(run.i);
 const fk=(p.type==='rest'||p.type==='ready')?((nx&&nx.fig)||p.fig):p.fig;
 pl.className='open'+(p.type==='work'?' work':'');
 pin.innerHTML=`<div class="pbar"><span>${p.label}</span><span>${run.mode==='test'?'':(run.i)+' / '+(run.phases.length-1)}</span></div>
 <div class="prog"><i id="pprog"></i></div>
 <div class="pmain">
  <div class="ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width="10"/><circle id="parc" cx="100" cy="100" r="90" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="565.5" stroke-dashoffset="0"/></svg><div class="num" id="pnum"></div></div>
  ${fk?figSVG(fk,'fig pfig'):''}<div class="pname">${p.name}</div><div class="pcue">${p.cue}</div>
  ${nx&&p.type!=='ready'&&run.mode!=='test'?`<div class="pnext">Next: ${nx.name}</div>`:''}
 </div>
 <div class="pctl">
  <button id="pback" aria-label="Previous">Back</button>
  <button class="main" id="ppause">${run.paused?'Resume':'Pause'}</button>
  <button id="pskip" aria-label="Skip">Skip</button>
 </div>
 <button class="pend" id="pquit">${run.endArm?'Tap again to end':'End session'}</button>`;
 $('#ppause').onclick=()=>{if(run.paused){run.end=Date.now()+run.pausedLeft;run.paused=false;}else{run.pausedLeft=remaining();run.paused=true;}drawPlayer();};
 $('#pskip').onclick=()=>{if(run.i+1<run.phases.length)begin(run.i+1);else complete(true);};
 $('#pback').onclick=()=>{if(run.i>1){run.doneSecs=Math.max(0,run.doneSecs-run.phases[run.i-1].secs);begin(run.i-1);}else begin(run.i);};
 $('#pquit').onclick=()=>{if(run.mode==='test'){closePlayer();return;}if(!run.endArm){run.endArm=true;drawPlayer();setTimeout(()=>{if(run&&run.endArm){run.endArm=false;if(run.mode==='workout')drawPlayer();}},3000);return;}
  const p=run.phases[run.i];if(p.type!=='ready')run.doneSecs+=p.secs-remaining()/1000;complete(false);};
 updateClock();
}
function complete(full){
 if(run.mode==='test'){testResult();return;}
 run.mode='finish';run.full=full;beep(880,600);buzz([200,100,200]);say(full?'Session complete. Good work.':'Session ended.');

 $('#pin').innerHTML=`<div class="finish">
  <h2 style="font-size:48px">${full?'Mission done':'Session ended'}</h2>
  <p>${run.sess.title}, ${mins} min${full?'':'. Program day stays open so you can finish it later.'}</p>
  <p class="muted" style="margin:10px 0 0">How hard was that?</p>
  <div class="chips" id="eff">${[1,2,3,4,5].map(n=>`<button class="chip" data-e="${n}" aria-pressed="false">${n}</button>`).join('')}</div>
  <p class="muted small">1 easy, 3 solid, 5 all-out.</p>

  if(run.full){S.done[s.level+'-'+s.week+'-'+s.day]=Date.now();

function buildLift(lv,w,d,mins){
 const P=MPH[w-1],sets=Math.max(2,P.sets+MLEVELS[lv].adj),perEx=sets*(45+P.rest),warm=180;
 let n=3;while(n<7&&warm+(n+1)*perEx-P.rest<=mins*60)n++;
 const D=MDAYS[d-1];
 return {title:D.t,sub:D.sub,ids:D.s.slice(0,n),sets,lo:P.lo,hi:P.hi,rest:P.rest,note:P.note,tempo:!!P.tempo,deload:!!P.deload,week:w,day:d,level:lv,total:warm+n*perEx-P.rest};
}
const rr=s=>s.lo===s.hi?String(s.lo):s.lo+' to '+s.hi;

function upHint(id,hi){const L=S.lifts[id];return !!(L&&L.reps.length&&L.reps.every(r=>r>=hi)&&L.band<4);}

function vTrain(){return trackChips()+(S.track==='mus'?vTrainMus():vTrainMil());}
function vProgram(){return trackChips()+(S.track==='mus'?vProgramMus():vProgramMil());}
function rankTxt(){return S.track==='mus'?MLEVELS[S.mlevel].name+'<br>'+(S.mfin?'Program complete':'Week '+S.mw+' of '+WEEKS):LEVELS[S.level].name+'<br>'+(S.finished?'Program complete':'Week '+S.week+' of '+WEEKS);}

/* lift player */
function startLift(){
 initAudio();const s=buildLift(S.mlevel,S.mw,S.md,S.mmins);
 run={mode:'lift',sess:s,ei:0,si:0,state:'set',log:[],t0:Date.now(),endArm:false};
 exDefaults();openPlayer();say(MEX[s.ids[0]].n);drawLift();if(!timer)timer=setInterval(tick,200);
}
function exDefaults(){
 const s=run.sess,id=s.ids[run.ei],L=S.lifts[id];
 run.band=L?L.band:2;
 if(L&&s.deload)run.band=Math.max(0,L.band-1);
 else if(L&&upHint(id,s.hi))run.band=Math.min(4,L.band+1);
 run.reps=s.hi;
}
function liftAdvance(skip){
 const s=run.sess;
 if(!skip&&run.si+1<s.sets)run.si++;
 else{run.ei++;run.si=0;if(run.ei>=s.ids.length){finishLift(true);return;}exDefaults();}
 if(skip){run.state='set';say(MEX[s.ids[run.ei]].n);drawLift();return;}
 run.state='rest';run.restDur=s.rest;run.restEnd=Date.now()+s.rest*1000;run.lastBeep=null;drawLift();
}
function liftTick(){
 if(run.state!=='rest')return;
 const ms=run.restEnd-Date.now(),left=Math.ceil(ms/1000);
 if(left<=3&&left>0&&run.lastBeep!==left){run.lastBeep=left;beep(820,120);}
 if(ms<=0){run.state='set';beep(1040,450);buzz([120,60,120]);const s=run.sess;say(MEX[s.ids[run.ei]].n+', set '+(run.si+1));drawLift();return;}
 const n=$('#pnum'),c=$('#parc');if(n)n.textContent=left;if(c)c.setAttribute('stroke-dashoffset',(565.5*(1-ms/(run.restDur*1000))).toFixed(1));
}
function quitBtn(){const q=$('#pquit');q.onclick=()=>{if(!run.endArm){run.endArm=true;q.textContent='Tap again to end';setTimeout(()=>{if(run&&run.endArm){run.endArm=false;q.textContent='End session';}},3000);return;}finishLift(false);};}
function drawLift(){
 const s=run.sess,id=s.ids[run.ei],pl=$('#player'),pin=$('#pin');
 const tot=s.ids.length*s.sets,done=run.ei*s.sets+run.si;
 run.endArm=false;
 if(run.state==='rest'){
  pl.className='open';
  pin.innerHTML=`<div class="pbar"><span>Rest</span><span>${done} of ${tot} sets</span></div>
  <div class="prog"><i style="width:${done/tot*100}%"></i></div>
  <div class="pmain"><div class="ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width="10"/><circle id="parc" cx="100" cy="100" r="90" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="565.5" stroke-dashoffset="0"/></svg><div class="num" id="pnum">${s.rest}</div></div>
  ${figSVG(MFIGMAP[id],'fig pfig')}<div class="pname">Rest</div><div class="pcue">Next: ${MEX[id].n}, set ${run.si+1} of ${s.sets}</div></div>
  <div class="pctl" style="grid-template-columns:1fr 1.4fr"><button id="padd">+15 sec</button><button class="main" id="pskip">Skip rest</button></div>
  <button class="pend" id="pquit">End session</button>`;
  $('#padd').onclick=()=>{run.restEnd+=15000;run.restDur+=15;};
  $('#pskip').onclick=()=>{run.restEnd=Date.now();};
  quitBtn();liftTick();return;
 }
 pl.className='open work';
 const hint=run.si===0&&!s.deload&&upHint(id,s.hi);
 pin.innerHTML=`<div class="pbar"><span>Lift ${run.ei+1} of ${s.ids.length}</span><span>Set ${run.si+1} of ${s.sets}</span></div>
 <div class="prog"><i style="width:${done/tot*100}%"></i></div>
 <div class="pmain" style="gap:8px">
  ${figSVG(MFIGMAP[id],'fig pfig')}<div class="pname">${MEX[id].n}</div><div class="pcue">${MEX[id].c}</div>
  <div class="pnext">Target ${rr(s)} reps${s.tempo?', 3 seconds down':''}${lastTxt(id)?'<br>'+lastTxt(id):''}${hint?'<br><b>You hit the top of the range last time, so the next band up is selected.</b>':''}</div>
  <div class="chips" style="justify-content:center;margin-top:6px" role="group" aria-label="Band">${BANDS.map((b,i)=>`<button class="chip" data-band="${i}" aria-pressed="${run.band===i}">${b}</button>`).join('')}</div>
  <div class="step"><button id="rm" aria-label="One less rep">−</button><div class="rv" id="rv">${run.reps}</div><button id="rp" aria-label="One more rep">+</button></div>
  <div class="small" style="opacity:.8">reps done</div>
 </div>
 <div class="pctl" style="grid-template-columns:1fr 1.4fr"><button id="pskipex">Skip lift</button><button class="main" id="pdone">Set done</button></div>
 <button class="pend" id="pquit">End session</button>`;
 document.querySelectorAll('#pin [data-band]').forEach(b=>b.onclick=()=>{run.band=+b.dataset.band;document.querySelectorAll('#pin [data-band]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
 $('#rm').onclick=()=>{run.reps=Math.max(0,run.reps-1);$('#rv').textContent=run.reps;};
 $('#rp').onclick=()=>{run.reps=Math.min(100,run.reps+1);$('#rv').textContent=run.reps;};
 $('#pdone').onclick=()=>{run.log.push({id,band:run.band,reps:run.reps});beep(660,150);liftAdvance(false);};
 $('#pskipex').onclick=()=>liftAdvance(true);
 quitBtn();
}
function finishLift(full){
 const s=run.sess;run.mode='finish';run.full=full;beep(880,600);buzz([200,100,200]);say(full?'Session complete. Good work.':'Session ended.');
 run.mins=Math.max(1,Math.round((Date.now()-run.t0)/60000));
 const by={};run.log.forEach(x=>{(by[x.id]=by[x.id]||[]).push(x);});
 const vol=run.log.reduce((a,x)=>a+x.reps,0);
 $('#player').className='open';
 $('#pin').innerHTML=`<div class="finish" style="overflow-y:auto">
  <h2 style="font-size:48px">${full?'Mission done':'Session ended'}</h2>
  <p>${s.title}, ${run.mins} min, ${run.log.length} sets, ${vol} reps in total.${full?'':' Program day stays open so you can finish it later.'}</p>
  ${Object.keys(by).length?`<ul class="hist small">${Object.keys(by).map(id=>`<li><span>${MEX[id].n}</span><span class="muted" style="text-align:right">${BANDS[by[id][by[id].length-1].band]}, ${by[id].map(x=>x.reps).join(', ')}</span></li>`).join('')}</ul>`:''}
  <p class="muted" style="margin:6px 0 0">How hard was that?</p>
  <div class="chips" id="eff">${[1,2,3,4,5].map(n=>`<button class="chip" data-e="${n}" aria-pressed="false">${n}</button>`).join('')}</div>
  <p class="muted small">1 easy, 3 solid, 5 all-out.</p>
  <button class="btn" id="logit">Log session</button>
  <button class="btn ghost" id="discard">Discard</button></div>`;
 document.querySelectorAll('#eff .chip').forEach(b=>b.onclick=()=>{run.effort=+b.dataset.e;document.querySelectorAll('#eff .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));});
 $('#logit').onclick=()=>{
  S.sessions.push({ts:Date.now(),title:'Muscle: '+s.title,mins:run.mins,track:'mus',effort:run.effort||null,full:run.full});
  Object.keys(by).forEach(id=>{const a=by[id];S.lifts[id]={band:a[a.length-1].band,reps:a.map(x=>x.reps),ts:Date.now()};});
  if(run.full){S.done['M'+s.level+'-'+s.week+'-'+s.day]=Date.now();
   if(s.week===S.mw&&s.day===S.md){if(S.md<DPW)S.md++;else if(S.mw<WEEKS){S.mw++;S.md=1;}else S.mfin=true;}}
  save();tab='log';closePlayer();window.scrollTo(0,0);
 };
 $('#discard').onclick=closePlayer;
}

  <p class="muted small" style="margin:0">Signing out clears this phone, so someone else can sign in. Your records stay saved online under your email.</p>`
 :`<p class="muted">Type your email to open your log. First time? Your account is created automatically. Use the same email on any phone or laptop to get your records.</p>
  <input id="acEmail" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" aria-label="Email address" value="${esc(acE)}" style="${inp}">
  <button class="btn" id="acIn">Sign in</button>
  ${!S.owner&&(S.sessions.length||S.tests.length)?'<p class="muted small" style="margin:0">The workouts already on this phone will be added to your account when you sign in.</p>':''}
  <p class="muted small" style="margin:0">No password: anyone who types your email can open your log.</p>`}
 ${acctMsg?`<p class="small" role="status" style="margin:0">${esc(acctMsg)}</p>`:''}
 <button class="btn ghost" id="acClose">Close</button></div>`;
 $('#acClose').onclick=closeAcct;
 const i=$('#acIn');if(i)i.onclick=signIn;
 const e=$('#acEmail');if(e)e.onkeydown=ev=>{if(ev.key==='Enter')signIn();};
 const y=$('#acSync');if(y)y.onclick=()=>cloudPull(false);
 const o=$('#acOut');if(o)o.onclick=signOut;
}
async function startUser(email){user={id:await emailKey(email),email:normEmail(email)};try{localStorage.setItem(EKEY,user.email);}catch(e){}acctBtn();await cloudPull(true);}
async function signIn(){
 acE=(($('#acEmail')||{}).value||'').trim();
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(acE)){acctMsg='Please enter a valid email address.';drawAcct();return;}
 acctMsg='Signing in…';drawAcct();
 try{await startUser(acE);acctMsg=cloud==='err'?'Signed in, but can’t reach the server yet. Your records will sync when you’re online.':'Signed in.';}
 catch(e){user=null;acctMsg='Could not sign in. Check your internet and try again.';}
 acctBtn();drawAcct();
}
async function signOut(){
 if(user)await cloudPush();
 user=null;cloud='off';S=fresh();saveLocal();try{localStorage.removeItem(EKEY);}catch(e){}
 acctMsg='Signed out. Your records are saved online under your email.';render();acctBtn();drawAcct();
}
if(sb){
 let saved='';try{saved=localStorage.getItem(EKEY)||'';}catch(e){}
 if(saved)setTimeout(()=>startUser(saved).catch(()=>{}),0);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&user)cloudPull(false);});
}
document.getElementById('acctBtn').onclick=openAcct;
acctBtn();

render();
</script>
</body>
</html>
